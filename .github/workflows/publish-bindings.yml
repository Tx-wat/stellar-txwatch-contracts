name: Publish TypeScript Bindings

# Issue #475 — publish both TypeScript binding packages to npm on every
# published GitHub release. Manual runs (workflow_dispatch) execute only the
# dry-run path: they build each package and log exactly what `npm publish`
# would upload, without publishing anything.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-bindings:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - package: alert-registry
            wasm: alert_registry
            npm_name: "@tx-wat/alert-registry-bindings"
          - package: watcher-registry
            wasm: watcher_registry
            npm_name: "@tx-wat/watcher-registry"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # ── Rust / WASM build ────────────────────────────────────────────────────
      - name: Install Rust wasm32 target
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # master
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build contracts (WASM)
        run: cargo build --release --target wasm32-unknown-unknown

      # ── Stellar CLI ──────────────────────────────────────────────────────────
      - name: Install Stellar CLI
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/releases/latest/download/stellar-cli-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin stellar
          stellar --version

      # ── Generate TypeScript bindings ─────────────────────────────────────────
      # `stellar contract bindings typescript` reads the WASM contract spec and
      # emits a fully-typed npm package into the output directory.
      - name: Generate ${{ matrix.package }} TypeScript bindings
        run: |
          stellar contract bindings typescript \
            --wasm target/wasm32-unknown-unknown/release/${{ matrix.wasm }}.wasm \
            --contract-id CXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX \
            --output-dir bindings/${{ matrix.package }} \
            --overwrite

      # ── Merge hand-maintained package metadata ───────────────────────────────
      # The generator writes its own package.json; we overlay our curated
      # metadata so the published package has the correct npm identity.
      - name: Overlay package.json metadata
        env:
          PKG_DIR: bindings/${{ matrix.package }}
          NPM_NAME: ${{ matrix.npm_name }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node - <<'EOF'
          const fs   = require("fs");
          const path = `${process.env.PKG_DIR}/package.json`;

          const generated = JSON.parse(fs.readFileSync(path, "utf8"));
          const pkgName = process.env.NPM_NAME;
          const dirName = process.env.PKG_DIR.split("/").pop();

          const meta = {
            name:        pkgName,
            version:     process.env.RELEASE_TAG.replace(/^v/, ""),
            description: `TypeScript bindings for the stellar-txwatch ${dirName} Soroban contract`,
            keywords:    ["stellar", "soroban", "smart-contract", dirName, "txwatch", "blockchain"],
            author:      "Tx-wat <https://github.com/Tx-wat>",
            license:     "MIT",
            repository: {
              type:      "git",
              url:       "https://github.com/Tx-wat/stellar-txwatch-contracts.git",
              directory: process.env.PKG_DIR,
            },
            homepage: "https://github.com/Tx-wat/stellar-txwatch-contracts#readme",
            bugs:     { url: "https://github.com/Tx-wat/stellar-txwatch-contracts/issues" },
          };

          const merged = { ...generated, ...meta };
          fs.writeFileSync(path, JSON.stringify(merged, null, 2) + "\n");
          console.log("package.json merged:", merged.name, merged.version);
          EOF

      # ── Node.js / npm setup ──────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # ── Install deps and build ───────────────────────────────────────────────
      - name: Install dependencies
        working-directory: bindings/${{ matrix.package }}
        run: npm install

      - name: Build TypeScript package
        working-directory: bindings/${{ matrix.package }}
        run: npm run build

      # ── Dry run: log what would be published (always runs) ───────────────────
      - name: Dry run (log package contents, nothing published)
        working-directory: bindings/${{ matrix.package }}
        run: |
          echo "Would publish ${{ matrix.npm_name }} with the following contents:"
          npm publish --dry-run --access public

      # ── Publish to npm (release events only) ─────────────────────────────────
      - name: Publish to npm
        if: github.event_name == 'release'
        working-directory: bindings/${{ matrix.package }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
