name: WASM Binary Size Check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# WASM size budget
# -----------------
# Hard budget per contract: 200 KB (204800 bytes).
# Large WASM binaries increase deployment costs and transaction fees on Stellar,
# so CI fails if any built binary exceeds this threshold.
# To change the budget, update WASM_SIZE_LIMIT_KB below.
env:
  WASM_SIZE_LIMIT_KB: 200

jobs:
  wasm-size:
    name: Check WASM binary sizes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          targets: wasm32-unknown-unknown

      - name: Build WASM binaries
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Check binary sizes
        run: |
          # Budget: 200 KB per contract (see WASM_SIZE_LIMIT_KB above).
          LIMIT=$(( ${{ env.WASM_SIZE_LIMIT_KB }} * 1024 ))
          FAILED=0

          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            SIZE=$(stat -c%s "$wasm")
            SIZE_KB=$(( SIZE / 1024 ))
            echo "$wasm: ${SIZE_KB}KB"
            if [ "$SIZE" -gt "$LIMIT" ]; then
              echo "ERROR: $wasm exceeds budget of ${{ env.WASM_SIZE_LIMIT_KB }}KB (actual: ${SIZE_KB}KB)"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "WASM size exceeds ${{ env.WASM_SIZE_LIMIT_KB }} KB budget!"
            exit 1
          fi
