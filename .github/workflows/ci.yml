name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # Issue #318 — rely on rust-toolchain.toml for the pinned toolchain,
      # targets, and components so CI matches local builds.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b  # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Issue #320 — enforce SPDX license headers on all source files
      - name: Check SPDX license headers
        run: |
          missing=0
          while IFS= read -r file; do
            if ! head -n 1 "$file" | grep -q 'SPDX-License-Identifier: MIT'; then
              echo "::error file=$file::Missing SPDX license header"
              missing=1
            fi
          done < <(find . \( -name '*.rs' -o -name '*.ts' \) -not -path '*/target/*' -not -path '*/node_modules/*')
          exit $missing

      # Issue #474 — fast WASM type/compile check before the full release build
      - name: Check (WASM target)
        run: cargo check --target wasm32-unknown-unknown

      # Issue #99 — WASM build verification
      - name: Build (WASM)
        run: cargo build --release --target wasm32-unknown-unknown

      # Issue #102 — Test suite verification
      - name: Unit tests
        run: cargo test -p alert-registry -p watcher-registry

      # Issue #472 — run feature-gated tests (e.g. gating_tests behind `testutils`)
      - name: Tests (all features)
        run: cargo test --all-features

      # Issue #300 — Integration test verification (cross-contract behavior)
      - name: Integration tests
        run: cargo test -p integration-tests

      # Issue #100 / #289 — Clippy lint check (deny warnings)
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Issue #291 — Rustdoc link check
      - name: Docs
        run: RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --all-features

      # Issue #283 — Rustdoc build verification (fail on warnings)
      - name: Doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

      # Issue #105 — Dependency vulnerability scanning
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo audit
        run: cargo audit

  # Issue #473 — run unit tests on the pinned toolchain and on newer channels
  # so regressions from new Rust releases are caught early. `rustup override`
  # takes precedence over rust-toolchain.toml, so each leg really runs its
  # own channel. The beta leg is non-blocking.
  toolchain-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [1.88.0, stable, beta]
    continue-on-error: ${{ matrix.toolchain == 'beta' }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b  # master
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: wasm32-unknown-unknown

      - name: Override toolchain for this job
        run: rustup override set ${{ matrix.toolchain }}

      - name: Unit tests (${{ matrix.toolchain }})
        run: cargo test -p alert-registry -p watcher-registry
