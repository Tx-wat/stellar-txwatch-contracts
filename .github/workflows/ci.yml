name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # Issue #318 — rely on rust-toolchain.toml for the pinned toolchain,
      # targets, and components so CI matches local builds.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b  # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt, llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Issue #320 — enforce SPDX license headers on all source files
      - name: Check SPDX license headers
        run: |
          missing=0
          while IFS= read -r file; do
            if ! head -n 1 "$file" | grep -q 'SPDX-License-Identifier: MIT'; then
              echo "::error file=$file::Missing SPDX license header"
              missing=1
            fi
          done < <(find . \( -name '*.rs' -o -name '*.ts' \) -not -path '*/target/*' -not -path '*/node_modules/*')
          exit $missing

      # Issue #474 — fast WASM type/compile check before the full release build
      - name: Check (WASM target)
        run: cargo check --target wasm32-unknown-unknown

      # Issue #99 — WASM build verification
      - name: Build (WASM)
        run: cargo build --release --target wasm32-unknown-unknown

      # Issue #102 — Test suite verification
      - name: Unit tests
        run: cargo test -p alert-registry -p watcher-registry

      # Issue #472 — run feature-gated tests (e.g. gating_tests behind `testutils`)
      - name: Tests (all features)
        run: cargo test --all-features

      # Issue #300 — Integration test verification (cross-contract behavior)
      - name: Integration tests
        run: cargo test -p integration-tests

      # Issue #477 — Enforce per-crate line-coverage floors from README.md
      # (alert-registry >= 90%, watcher-registry >= 90%, integration-tests >= 80%).
      # Each crate is measured separately so one crate cannot mask another.
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Coverage floor (alert-registry >= 90%)
        run: cargo llvm-cov -p alert-registry --fail-under-lines 90 --summary-only

      - name: Coverage floor (watcher-registry >= 90%)
        run: cargo llvm-cov -p watcher-registry --fail-under-lines 90 --summary-only

      - name: Coverage floor (integration-tests >= 80%)
        run: cargo llvm-cov -p integration-tests --fail-under-lines 80 --summary-only

      # Issue #100 / #289 — Clippy lint check (deny warnings)
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Issue #291 — Rustdoc link check
      - name: Docs
        run: RUSTDOCFLAGS='-D warnings' cargo doc --no-deps --all-features

      # Issue #283 — Rustdoc build verification (fail on warnings)
      - name: Doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

      # Issue #105 / #476 — Dependency vulnerability scanning.
      # `cargo audit` exits non-zero on any advisory matching a dependency in
      # Cargo.lock; `--deny warnings` also fails on unmaintained/yanked crates
      # so that a high-severity advisory can never pass silently.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cargo audit
        run: cargo audit --deny warnings
